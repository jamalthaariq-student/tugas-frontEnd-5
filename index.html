<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk UMKM (Admin)</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Manajemen Data Produk UMKM</h1>
            <nav>
                <a href="index.html" class="nav-active">Admin CRUD</a> | 
                <a href="productCard.html">Lihat Katalog Card</a>
            </nav>
        </header>

        <div class="card">
            <h2 id="formTitle">Tambah Produk Baru</h2>
            <div id="notification"></div>
            
            <form id="productForm">
                <!-- Hidden input untuk menyimpan ID saat mode Edit -->
                <input type="hidden" id="editId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Nama Produk</label>
                        <input type="text" id="name" required placeholder="Masukkan nama produk">
                    </div>
                    <div class="form-group">
                        <label for="category">Kategori</label>
                        <select id="category" required>
                            <option value="">Pilih Kategori</option>
                            <option value="Camilan">Camilan</option>
                            <option value="Makanan">Makanan</option>
                            <option value="Minuman">Minuman</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="price">Harga (Rp)</label>
                        <input type="number" id="price" min="0" required placeholder="Masukkan harga produk">
                    </div>
                    <div class="form-group">
                        <label for="stock">Jumlah Stok</label>
                        <input type="number" id="stock" min="0" required placeholder="Masukkan jumlah stok">
                    </div>
                </div>
                <button type="submit" id="submitBtn">Tambah Produk</button>
                <button type="button" id="cancelBtn" style="display: none; background-color: #64748b;">Batal Edit</button>
            </form>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="margin: 0; border: none;">Daftar Produk</h2>
                <!-- Input Pencarian -->
                <input type="text" id="searchInput" placeholder="Cari nama produk..." style="width: 250px;">
            </div>
            
            <div style="overflow-x: auto;">
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama Produk</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Stok</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data Tabel -->
                    </tbody>
                </table>
            </div>
            <div class="summary-box" id="totalNilaiStokBox">
            Total Nilai Stok Keseluruhan: Rp0
            </div>
        </div>
    </div>
    <script src="assets/js/logic.js"></script>
</body>
</html>
